name: Build iOS app

on:
  push:
    branches: [main, vhscamlite]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable) with iOS target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: NtscCore

      - name: Build ntsc-rs static library (device)
        working-directory: NtscCore
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        run: cargo build --release --target aarch64-apple-ios

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (unsigned)
        run: |
          xcodebuild \
            -project VHSCam.xcodeproj \
            -scheme VHSCam \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/VHSCam.app Payload/
          zip -qr VHSCam-unsigned.ipa Payload

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: VHSCam-unsigned-ipa
          path: VHSCam-unsigned.ipa
