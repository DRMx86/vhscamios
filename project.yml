name: VHSCam
options:
  bundleIdPrefix: com.drmx86
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  VHSCam:
    type: application
    platform: iOS
    sources:
      - path: VHSCam/Sources
      - path: VHSCam/Resources
    info:
      path: VHSCam/Info.plist
      properties:
        CFBundleDisplayName: VHS Cam
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arm64
        NSCameraUsageDescription: VHS Cam uses the camera to apply a live VHS effect.
        NSMicrophoneUsageDescription: VHS Cam records audio together with your VHS video.
        NSPhotoLibraryAddUsageDescription: VHS Cam saves your VHS photos and videos to your library.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.drmx86.vhscam
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_OBJC_BRIDGING_HEADER: VHSCam/Sources/VHSCam-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_BITCODE: NO
        # Rust static library built by `cargo build --release --target aarch64-apple-ios[-sim]`
        LIBRARY_SEARCH_PATHS[sdk=iphoneos*]: $(SRCROOT)/NtscCore/target/aarch64-apple-ios/release
        LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]: $(SRCROOT)/NtscCore/target/aarch64-apple-ios-sim/release
        OTHER_LDFLAGS: "-lntsc_ios -lc++ -liconv"
